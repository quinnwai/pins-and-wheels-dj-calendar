[project]
name = "pins-and-wheels-dj-calendar"
version = "0.1.0"
description = "Daily job that turns the Pins & Wheels guest DJ flyer into a subscribable calendar."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.4",
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "icalendar>=6.1",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
